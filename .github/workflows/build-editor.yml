
name: Build Digital World PDF Editor

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PDF Editor
        env:
          PUBLIC_BASE_PATH: /Drive/pdf-editor/editor/
        run: pnpm build

      - name: Verify Build
        run: |
          test -f dist/index.html
          echo "PDF Editor build successful"
          ls -lah dist

      - name: Package Build
        run: |
          cd dist
          zip -r ../Digital-World-PDF-Editor.zip .

      - name: Upload Build ZIP
        uses: actions/upload-artifact@v5
        with:
          name: Digital-World-PDF-Editor
          path: Digital-World-PDF-Editor.zip
          retention-days: 7
